name: Sesame Studio
on:
  pull_request:
    paths: ['software/sesame-studio/**', '.github/workflows/studio.yml']
  push:
    branches: [main]
    paths: ['software/sesame-studio/**', '.github/workflows/studio.yml']
permissions:
  contents: read
jobs:
  studio:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: software/sesame-studio/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - run: python -m pip install -r software/sesame-studio/requirements.txt
      - run: python -m unittest discover -s software/sesame-studio/tests -v
      - run: python -m compileall -q software/sesame-studio
      - run: xvfb-run -a python software/sesame-studio/tests/gui_smoke.py
